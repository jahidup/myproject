<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam | Test Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="px-4 py-6 md:px-8">
    <main class="mx-auto max-w-7xl">
      <header class="glass-card flex flex-col gap-4 p-5 lg:flex-row lg:items-center lg:justify-between">
        <div>
          <h1 id="testTitle" class="text-2xl font-bold text-slate-100">Loading test...</h1>
          <p id="testMeta" class="text-sm text-slate-300">Please wait...</p>
        </div>
        <div class="flex items-center gap-3">
          <div class="glass-pill px-4 py-2 text-sm text-cyan-100">
            Time Left: <span id="timer" class="font-semibold">00:00</span>
          </div>
          <button id="exitBtn" class="btn-soft">Exit</button>
        </div>
      </header>

      <section class="mt-6 grid gap-5 xl:grid-cols-[0.34fr_0.66fr]">
        <aside class="glass-card p-4">
          <p id="questionCounter" class="text-sm text-slate-200">Question 1 / 1</p>
          <div id="questionPanel" class="mt-4 grid grid-cols-5 gap-2 md:grid-cols-6 xl:grid-cols-4"></div>
          <div class="mt-4 space-y-2 text-xs text-slate-300">
            <p><span class="inline-block h-2 w-2 rounded-full bg-emerald-400"></span> Answered</p>
            <p><span class="inline-block h-2 w-2 rounded-full bg-amber-400"></span> Flagged</p>
            <p><span class="inline-block h-2 w-2 rounded-full bg-slate-400"></span> Pending</p>
          </div>
        </aside>

        <article class="glass-card p-5 md:p-6">
          <h2 id="questionTextEn" class="text-xl font-semibold text-cyan-100"></h2>
          <p id="questionTextHi" class="mt-2 text-base text-slate-200"></p>
          <img
            id="questionImage"
            alt="Question"
            class="mt-4 hidden w-full max-w-xl rounded-lg border border-white/20 object-contain"
          />

          <div id="optionsWrap" class="mt-5 space-y-3"></div>
          <div id="numericalWrap" class="mt-5 hidden">
            <label class="mb-1 block text-sm text-slate-200" for="numericalInput">Numerical Answer</label>
            <input
              id="numericalInput"
              class="input-glass max-w-xs"
              placeholder="Type number..."
              inputmode="decimal"
            />
          </div>

          <div class="mt-6 flex flex-wrap gap-2">
            <button id="clearAnswerBtn" class="btn-soft">Clear Answer</button>
            <button id="flagQuestionBtn" class="btn-soft">Flag</button>
          </div>

          <div class="mt-8 flex flex-wrap justify-between gap-3 border-t border-white/10 pt-5">
            <div class="flex gap-2">
              <button id="prevQuestionBtn" class="btn-soft">Previous</button>
              <button id="nextQuestionBtn" class="btn-soft">Next</button>
            </div>
            <button id="submitTestBtn" class="btn-primary">Submit Test</button>
          </div>
        </article>
      </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/test.js"></script>
  </body>
</html>
